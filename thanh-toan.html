<!DOCTYPE html><html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Thanh toán — Mạnh Fashion</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="toast"></div><header id="header"></header><main class="section checkout"><div><span class="eyebrow">CHECKOUT</span><h1>Thanh toán</h1></div><div class="checkout-grid"><form id="checkoutForm" class="card"><h2>Thông tin người nhận</h2><label>Họ tên</label><input id="shipName" required><label>Số điện thoại</label><input id="shipPhone" required><label>Tỉnh / Thành phố</label><input id="shipCity" required placeholder="Hà Nội"><label>Địa chỉ nhận hàng</label><textarea id="shipAddress" required placeholder="Số nhà, đường, phường/xã..."></textarea><label>Ghi chú</label><textarea id="shipNote" placeholder="Giao giờ hành chính..."></textarea><h2>Phương thức thanh toán</h2><label class="pay-option"><input type="radio" name="payment" value="COD" checked> 🚚 COD — Thanh toán khi nhận hàng</label><label class="pay-option"><input type="radio" name="payment" value="BANK"> 🏦 Chuyển khoản ngân hàng</label><label class="pay-option"><input type="radio" name="payment" value="EWALLET"> 📱 Ví điện tử</label><div id="payInfo" class="pay-info"></div><button class="btn btn-dark full">Đặt hàng ✓</button></form><aside id="checkoutSummary" class="card"></aside></div></main><footer id="footer"></footer><script src="js/app.js"></script><script>initCheckout();</script></body></html>
