<!DOCTYPE html><html lang="vi"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quản lý sản phẩm — Mạnh Fashion</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="toast"></div><header id="header"></header><main class="section"><div class="section-head"><div><span class="eyebrow">ADMIN DEMO</span><h1>Quản lý sản phẩm</h1></div><button class="btn btn-dark" onclick="openAdminForm()">+ Thêm sản phẩm</button></div><div id="adminTable"></div></main><div id="adminModal" class="modal"><div class="modal-box"><button class="modal-close" onclick="closeAdminForm()">×</button><h2 id="modalTitle">Thêm sản phẩm</h2><form id="adminForm"><input type="hidden" id="editId"><label>Tên sản phẩm</label><input id="aName" required><label>Giá</label><input id="aPrice" type="number" min="1" required><label>Danh mục</label><select id="aCat"><option>Áo</option><option>Quần</option><option>Giày</option><option>Phụ kiện</option></select><label>Số lượng</label><input id="aStock" type="number" min="0" required><label>URL hình ảnh</label><input id="aImage" required><button class="btn btn-dark full">Lưu sản phẩm</button></form></div></div><footer id="footer"></footer><script src="js/app.js"></script><script>initAdmin();</script></body></html>
